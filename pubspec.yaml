name: cab_app
description: CAB Fan App – Club Athlétique Bizertin official mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # HTTP & API
  http: ^1.2.0
  sanity_client: ^1.9.1  # or use http directly with GROQ queries

  # Image
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9

  # Local storage
  shared_preferences: ^2.2.2

  # Navigation
  go_router: ^13.0.0

  # Notifications
  #firebase_core: ^2.24.2
  #firebase_messaging: ^14.7.10
  #flutter_local_notifications: ^17.0.0

  # UI helpers
  shimmer: ^3.0.0              # loading skeleton
  intl: ^0.19.0                # date formatting
  url_launcher: ^6.2.4
  flutter_staggered_animations: ^1.1.1

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600